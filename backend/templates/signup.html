{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Wareloom</title>
    
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

    <link rel="shortcut icon" type="image/png" href="{% static 'images/logo.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>
    <main class="auth-page">
        <div class="orb orb-one" aria-hidden="true"></div>
        <div class="orb orb-two" aria-hidden="true"></div>
        <a class="brand" href="{% url 'home' %}" aria-label="Wareloom home">
            <span><i class="bi bi-box-seam" aria-hidden="true"></i></span>
            <b>Wareloom</b>
        </a>
        <div class="auth-card" aria-labelledby="signup-title">
            <h1 id="signup-title">A smarter warehouse<br>starts <em>here.</em></h1>
            <p>Set up your Wareloom workspace in just a few moments.</p>
            <form id="signup-form" method="POST" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="input-grid">
                    <label for="first-name">
                        First name <input id="first-name" type="text" name="firstName" placeholder="Enter first name"
                            autocomplete="given-name" required>
                    </label>
                    <label for="last-name">
                        Last name <input id="last-name" type="text" name="lastName" placeholder="Enter last name"
                            autocomplete="family-name" required>
                    </label>
                </div>
                <label for="signup-email">
                    Work email <input id="signup-email" type="email" name="email"
                        placeholder="Enter email in proper format" autocomplete="email" required>
                </label>
                <label for="signup-password">
                    Password
                    <div class="password-field">
                        <input id="signup-password" type="password" name="password" placeholder="At least 8 characters"
                            autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </label>
                <label class="check terms">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the<a href="#">Terms</a>and<a href="#">Privacy Policy</a>.</span>
                </label>
                <button class="submit" type="submit">
                    Create my account<i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>
            <div>
                <p class="back">
                    <a href="{% url 'home' %}"><i class="bi bi-arrow-left" aria-hidden="true"></i>Back to website</a>
                </p>
                <p class="switch">Already have an account?<a href="{% url 'login' %}">Log in</a></p>
            </div>
        </div>
    </main>
    <script src="{% static 'js/auth.js' %}"></script>
</body>

</html>
