{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Wareloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

    <link rel="shortcut icon" type="image/png" href="{% static 'images/logo.png' %}">

</head>

<body>
    <main class="auth-page">
        <div class="orb orb-one" aria-hidden="true"></div>
        <div class="orb orb-two" aria-hidden="true"></div>
        <a class="brand" href="{% url 'home' %}" aria-label="Wareloom home">
            <span><i class="bi bi-box-seam" aria-hidden="true"></i></span>
            <b>Wareloom</b>
        </a>

        <section class="auth-card" aria-labelledby="login-title">
        <div aria-labelledby="login-title">
            <h1 id="login-title">Log in to your<br>Wareloom <em>workspace.</em></h1>
            <form id="login-form" method="POST">
                {% csrf_token %}
                <label for="login-email">Email address<input id="login-email" type="email" name="email"
                        placeholder="you@company.com" autocomplete="email" required></label>
                <label for="login-password">Password
                    <div class="password-field">
                        <input id="login-password" type="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </label>
                <div class="form-row">
                    <label class="check">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                <button class="submit" type="submit">Log in
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </button>
                <p class="form-message" role="status" aria-live="polite">

                </p>
            </form>
            <p class="back">
                <a href="{% url 'home' %}">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    Back to website
                </a>
            </p>
            <p class="switch">New to Wareloom? <a href="{% url 'signup' %}">Create an account</a></p>
        </div>
        </section>

    </main>
    <!-- <script src="{% static 'js/auth.js' %}"></script> -->
</body>

</html>
